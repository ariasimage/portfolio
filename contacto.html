<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Javier Arias, desarrollador full stack"
    />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/z6bhb6c7/image/upload/v1793443373/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Contacto | Javier Arias</title>
  </head>
  <body>
    <header class="header__main"></header>

    <main class="main--grow">
   
      <section class="contact" id="contacto">
        <div class="contact__container">
          <p class="section__label contact__tag">— Contacto</p>
          <h1 class="contact__title">¿Hablamos?</h1>
          <p class="contact__intro">
            Cuéntame en qué estás trabajando. Rellena el formulario y te
            responderé lo antes posible.
          </p>

          <form class="contact__form" action="#" method="POST">
            <div class="contact__row">
              <div class="contact__field">
                <label class="contact__label" for="nombre">Nombre</label>
                <input
                  class="contact__input"
                  type="text"
                  id="nombre"
                  name="nombre"
                  placeholder="Tu nombre"
                  autocomplete="name"
                  required
                />
              </div>
              <div class="contact__field">
                <label class="contact__label" for="email">Email</label>
                <input
                  class="contact__input"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="tu@email.com"
                  autocomplete="email"
                  required
                />
              </div>
            </div>

            <div class="contact__field">
              <label class="contact__label" for="asunto">Asunto</label>
              <input
                class="contact__input"
                type="text"
                id="asunto"
                name="asunto"
                placeholder="¿En qué puedo ayudarte?"
                required
              />
            </div>

            <div class="contact__field">
              <label class="contact__label" for="mensaje">Mensaje</label>
              <textarea
                class="contact__input contact__textarea"
                id="mensaje"
                name="mensaje"
                rows="6"
                placeholder="Escribe aquí tu mensaje"
                required
              ></textarea>
            </div>

            <button class="contact__submit" type="submit">Enviar mensaje</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer"></footer>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
